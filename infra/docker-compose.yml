services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: recosphere
      POSTGRES_USER: recosphere
      POSTGRES_PASSWORD: recosphere
    ports:
      - "5432:5432"
    volumes:
      - recosphere_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recosphere -d recosphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env
    environment:
      RECOSPHERE_DATABASE_URL: postgresql+psycopg://recosphere:recosphere@postgres:5432/recosphere
      RECOSPHERE_JWT_SECRET: change-me-in-development
      RECOSPHERE_CORS_ORIGINS: http://localhost:3000,http://localhost:3100,http://localhost:5173
    ports:
      - "${RECOSPHERE_API_HOST_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_RECOSPHERE_API_URL: ${NEXT_PUBLIC_RECOSPHERE_API_URL:-http://localhost:8010}
    environment:
      NEXT_PUBLIC_RECOSPHERE_API_URL: ${NEXT_PUBLIC_RECOSPHERE_API_URL:-http://localhost:8010}
      RECOSPHERE_INTERNAL_API_URL: http://api:8000
    ports:
      - "${RECOSPHERE_WEB_HOST_PORT:-3100}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  recosphere_postgres_data:
